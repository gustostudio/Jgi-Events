name: Update Webflow CMS Data

on:
  schedule:
    # Sole trigger — the Webflow webhook (netlify/functions/webflow-webhook.js)
    # no longer dispatches this workflow, to keep Netlify build minutes down.
    # Cron has no fractional-hour step, so 2.5h is expressed as two schedules
    # landing on fixed times: 00:00/05:00/10:00/15:00/20:00 and
    # 02:30/07:30/12:30/17:30/22:30 UTC — 10 runs/day, 2.5h apart (except the
    # 22:30 -> 00:00 wrap, which is 1.5h since 24 isn't divisible by 2.5).
    - cron: '0 0,5,10,15,20 * * *'
    - cron: '30 2,7,12,17,22 * * *'
  workflow_dispatch: {}

# Queue runs so overlapping triggers can't race each other's push.
concurrency:
  group: update-cms-data
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch Webflow CMS data
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          WEBFLOW_SITE_ID: ${{ secrets.WEBFLOW_SITE_ID }}
          WEBFLOW_COLLECTION_ID: ${{ secrets.WEBFLOW_COLLECTION_ID }}
        run: node scripts/fetch-cms.js

      - name: Commit updated data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain public/data.json)" ]]; then
            git add public/data.json
            git commit -m "Update Webflow CMS data"
            git pull --rebase origin main
            git push
          else
            echo "No changes to public/data.json."
          fi
